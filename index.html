<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code-Block</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Snippets</h2>
      </div>
      <div class="sidebar-content">
        <button id="add-snippet-sidebar" class="add-snippet-btn">
          <i class="fas fa-plus"></i> New Snippet
        </button>
        <h3>Categories</h3>
        <ul class="category-list" id="category-list">
          <li data-category="all" class="active">All Snippets</li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <header>
        <div class="header-content">
          <h1>CODEVAULT</h1>
          <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search" placeholder="Search snippets...">
          </div>
          <div class="actions">
            <button id="add-snippet" class="primary-btn">Add Snippet</button>
            <button class="secondary-btn export-btn" onclick="exportSnippetsAsGist()">
              <i class="fas fa-upload"></i> Export All as Gist
            </button>
          </div>
        </div>
      </header>

      <div class="content-area">
        <div class="snippets-grid" id="snippets-grid"></div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="snippet-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add New Snippet</h2>
        <button class="close-modal" id="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="snippet-form">
          <input type="hidden" id="snippet-id">
          <label for="title">Title</label>
          <input type="text" id="title" required>
          <label for="category">Category</label>
          <input type="text" id="category" required>
          <label for="code">Code</label>
          <textarea id="code" required></textarea>
        </form>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn" id="cancel-snippet">Cancel</button>
        <button class="primary-btn" id="save-snippet">Save Snippet</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</body>
</html>
