<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Snippets</h2>
      <button id="add-snippet" class="primary-btn">New Snippet</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header>
        <h1>CODEVAULT</h1>
        <div class="actions">
          <button class="secondary-btn export-btn" onclick="exportAllSnippetsAsGist()">
            Export All as Gist
          </button>
        </div>
      </header>

      <div class="snippets-grid" id="snippets-grid"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="snippet-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add New Snippet</h2>
        <button class="close-modal" id="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="snippet-form">
          <input type="hidden" id="snippet-id">
          <label for="title">Title</label>
          <input type="text" id="title" required>
          <label for="category">Category</label>
          <input type="text" id="category" required>
          <label for="code">Code</label>
          <textarea id="code" required></textarea>
        </form>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn" id="cancel-snippet">Cancel</button>
        <button class="primary-btn" id="save-snippet">Save Snippet</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
